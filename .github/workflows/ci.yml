name: CI

# Hosted-only CI: every job runs on a GitHub-hosted ubuntu-latest runner and,
# where a toolchain is needed, in a public container image. There are no
# self-hosted runners, no project GPU labels, and no GitLab pipeline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_icpx:
        description: "Run the optional oneAPI icpx CPU job (non-gating)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned alpaka3 commit (the 3.0.0 tag) recorded in docs/build.md.
  ALPAKA_COMMIT: eb677e8d7f70d79b35df25d9002f94ba669b6f44

jobs:
  cpu:
    name: cpu (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRAPHFLOW_ALPAKA_SOURCE_DIR: ${{ github.workspace }}/.alpaka
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Check out graphFlow
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build g++ catch2 git ca-certificates

      - name: Clone pinned alpaka
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/alpaka-group/alpaka.git "$GRAPHFLOW_ALPAKA_SOURCE_DIR"
          git -C "$GRAPHFLOW_ALPAKA_SOURCE_DIR" checkout --detach "$ALPAKA_COMMIT"
          test "$(git -C "$GRAPHFLOW_ALPAKA_SOURCE_DIR" rev-parse HEAD)" = "$ALPAKA_COMMIT"

      - name: Configure
        run: |
          set -euo pipefail
          unset OMP_NUM_THREADS OMP_PROC_BIND OMP_PLACES GOMP_CPU_AFFINITY
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DGRAPHFLOW_ALPAKA_SOURCE_DIR="$GRAPHFLOW_ALPAKA_SOURCE_DIR" \
            -DGRAPHFLOW_ENABLE_OPENMP=OFF \
            -Dalpaka_COMPILE_PEDANTIC=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error \
            --output-junit ctest-cpu-${{ matrix.build_type }}.xml

      - name: Upload CTest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-cpu-${{ matrix.build_type }}
          path: build/ctest-cpu-${{ matrix.build_type }}.xml
          if-no-files-found: ignore

  sanitizers:
    name: sanitizers (ASAN+UBSAN)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      GRAPHFLOW_ALPAKA_SOURCE_DIR: ${{ github.workspace }}/.alpaka
    steps:
      - name: Check out graphFlow
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build g++ catch2 git ca-certificates

      - name: Clone pinned alpaka
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/alpaka-group/alpaka.git "$GRAPHFLOW_ALPAKA_SOURCE_DIR"
          git -C "$GRAPHFLOW_ALPAKA_SOURCE_DIR" checkout --detach "$ALPAKA_COMMIT"
          test "$(git -C "$GRAPHFLOW_ALPAKA_SOURCE_DIR" rev-parse HEAD)" = "$ALPAKA_COMMIT"

      - name: Configure
        run: |
          set -euo pipefail
          unset OMP_NUM_THREADS OMP_PROC_BIND OMP_PLACES GOMP_CPU_AFFINITY
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGRAPHFLOW_ALPAKA_SOURCE_DIR="$GRAPHFLOW_ALPAKA_SOURCE_DIR" \
            -DGRAPHFLOW_ENABLE_OPENMP=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -Dalpaka_COMPILE_PEDANTIC=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error \
            --output-junit ctest-sanitizers.xml

      - name: Upload CTest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-sanitizers
          path: build/ctest-sanitizers.xml
          if-no-files-found: ignore

  cuda-compile:
    name: cuda-compile (sm_70)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRAPHFLOW_ALPAKA_SOURCE_DIR: ${{ github.workspace }}/.alpaka
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for checkout
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out graphFlow
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build g++ catch2

      - name: Clone pinned alpaka
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/alpaka-group/alpaka.git "$GRAPHFLOW_ALPAKA_SOURCE_DIR"
          git -C "$GRAPHFLOW_ALPAKA_SOURCE_DIR" checkout --detach "$ALPAKA_COMMIT"
          test "$(git -C "$GRAPHFLOW_ALPAKA_SOURCE_DIR" rev-parse HEAD)" = "$ALPAKA_COMMIT"

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRAPHFLOW_ALPAKA_SOURCE_DIR="$GRAPHFLOW_ALPAKA_SOURCE_DIR" \
            -DGRAPHFLOW_ENABLE_OPENMP=OFF \
            -DGRAPHFLOW_ENABLE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=70

      # Compile-only gate: no nvidia-smi, no CTest, and no example run because
      # the hosted runner has no NVIDIA GPU.
      - name: Build (compile only)
        run: cmake --build build -j "$(nproc)"

  hip-compile:
    name: hip-compile (gfx90a)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: rocm/dev-ubuntu-24.04:7.2
    env:
      ROCM_PATH: /opt/rocm
      GRAPHFLOW_ALPAKA_SOURCE_DIR: ${{ github.workspace }}/.alpaka
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for checkout
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out graphFlow
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build g++ catch2

      - name: Expose ROCm tools
        run: echo "${ROCM_PATH}/bin" >> "$GITHUB_PATH"

      - name: Clone pinned alpaka
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/alpaka-group/alpaka.git "$GRAPHFLOW_ALPAKA_SOURCE_DIR"
          git -C "$GRAPHFLOW_ALPAKA_SOURCE_DIR" checkout --detach "$ALPAKA_COMMIT"
          test "$(git -C "$GRAPHFLOW_ALPAKA_SOURCE_DIR" rev-parse HEAD)" = "$ALPAKA_COMMIT"

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRAPHFLOW_ALPAKA_SOURCE_DIR="$GRAPHFLOW_ALPAKA_SOURCE_DIR" \
            -DGRAPHFLOW_ENABLE_OPENMP=OFF \
            -DGRAPHFLOW_ENABLE_HIP=ON \
            -DCMAKE_HIP_COMPILER="${ROCM_PATH}/llvm/bin/amdclang++" \
            -DCMAKE_HIP_ARCHITECTURES=gfx90a \
            -DCMAKE_PREFIX_PATH="${ROCM_PATH}" \
            -Dalpaka_DEP_OMP=OFF

      # Compile-only gate: the hosted runner has no AMD GPU, so no CTest run
      # and no example execution.
      - name: Build (compile only)
        run: cmake --build build -j "$(nproc)"

  reuse:
    name: reuse lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out graphFlow
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install REUSE
        run: python -m pip install --upgrade pip reuse==6.3.0

      - name: Lint license metadata
        run: reuse lint

  format:
    name: clang-format (20.1.8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out graphFlow
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: python -m pip install --upgrade pip clang-format==20.1.8

      # The format policy covers tracked C++ headers and sources under
      # include/, examples/, and tests/. Everything else is out of scope.
      - name: Check formatting
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git ls-files 'include/**/*.cpp' 'include/**/*.hpp' \
              'examples/**/*.cpp' 'examples/**/*.hpp' \
              'tests/**/*.cpp' 'tests/**/*.hpp'
          )
          test "${#files[@]}" -gt 0
          test "$(clang-format --version)" = "clang-format version 20.1.8"
          clang-format --dry-run --Werror "${files[@]}"

  # Optional and manual only. graphFlow has no SYCL backend, so this job does
  # not enable one: it builds and tests the CPU backend with Intel's host
  # compiler. It is not part of the push/PR gate.
  icpx-cpu:
    name: icpx-cpu (optional, CPU backend)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_icpx }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: intel/oneapi-hpckit:2025.3.0-0-devel-ubuntu24.04
    env:
      GRAPHFLOW_ALPAKA_SOURCE_DIR: ${{ github.workspace }}/.alpaka
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for checkout
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out graphFlow
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build g++ catch2

      - name: Clone pinned alpaka
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/alpaka-group/alpaka.git "$GRAPHFLOW_ALPAKA_SOURCE_DIR"
          git -C "$GRAPHFLOW_ALPAKA_SOURCE_DIR" checkout --detach "$ALPAKA_COMMIT"
          test "$(git -C "$GRAPHFLOW_ALPAKA_SOURCE_DIR" rev-parse HEAD)" = "$ALPAKA_COMMIT"

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          source /opt/intel/oneapi/setvars.sh
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=icpx \
            -DGRAPHFLOW_ALPAKA_SOURCE_DIR="$GRAPHFLOW_ALPAKA_SOURCE_DIR" \
            -DGRAPHFLOW_ENABLE_OPENMP=OFF

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          source /opt/intel/oneapi/setvars.sh
          cmake --build build -j "$(nproc)"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          source /opt/intel/oneapi/setvars.sh
          ctest --test-dir build --output-on-failure --no-tests=error \
            --output-junit ctest-icpx.xml

      - name: Upload CTest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-icpx
          path: build/ctest-icpx.xml
          if-no-files-found: ignore
